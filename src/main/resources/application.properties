spring.application.name=retirement_planner
spring.jackson.deserialization.accept-float-as-int=false
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/north}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.servlet.multipart.max-request-size=128KB
server.tomcat.max-http-form-post-size=128KB
north.ai.key=${OPENAI_API_KEY:}
north.ai.model=${OPENAI_MODEL:}
