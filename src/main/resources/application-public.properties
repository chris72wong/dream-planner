summit.public=true
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
# No durable server storage or shared scenario library in the public MVP.
spring.datasource.url=jdbc:h2:mem:public-mvp
spring.sql.init.mode=never
server.tomcat.max-http-form-post-size=128KB
server.tomcat.max-swallow-size=128KB
